name: Deploy Lovable SSG to IONOS (SFTP)

on:
  push:
    branches:
      - main
      - feature/static-site-upgrade
    # Reine Dokumentation loest keinen Build und keinen SFTP-Spiegel aus (12.08.2026,
    # docs/ci/CI-KOSTEN-STANDARD.md Punkt 6). Vorher fuhr jede Aenderung an einer .md-Datei
    # den vollstaendigen Weg: npm ci, Vite-Build, lftp mirror --delete ueber die ganze Seite.
    #
    # WARUM `paths-ignore` HIER GEFAHRLOS IST: der Standard warnt davor, weil es den LAUF
    # unterdrueckt und damit eine Check-Zeile entfallen laesst. In diesem Repo gibt es keine
    # Pflicht-Checks, keine Merge Queue und nichts, was auf eine Check-Zeile pollt — es gibt
    # ueberhaupt keinen `pull_request`-Ausloeser. Faellt der Lauf aus, faellt nichts anderes um.
    # (In maestro-cloud ist genau derselbe Punkt deshalb ueber einen Filter-Job geloest.)
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_run:
    workflows: ["Fetch Google Reviews (Daily)", "Update WM Fixtures (Daily)"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: deploy-ionos
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build Project (SSG)
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # VITE_* aus GH-Secrets (öffentliche Client-Vars, landen ohnehin im Bundle).
          # .env ist nicht mehr committet → diese Vars MÜSSEN hier gesetzt sein.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Copy .htaccess files to dist
        run: |
          cp public/.htaccess dist/.htaccess || echo "No .htaccess found"
          cp public/.htaccess-root dist/.htaccess-root || echo "No .htaccess-root found"

      - name: Deploy via LFTP (parallel uploads)
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -c "
            set sftp:auto-confirm yes;
            set net:timeout 30;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            set mirror:parallel-transfer-count 10;
            set mirror:parallel-directories yes;
            open -u ${{ secrets.IONOS_SFTP_USER }},${{ secrets.IONOS_SFTP_PASSWORD }} sftp://${{ secrets.IONOS_SFTP_HOST }};
            mirror --reverse --delete --verbose --parallel=10 ./dist/ ${{ secrets.IONOS_SFTP_TARGET_DIR }}/;
            put ./dist/.htaccess-root -o .htaccess;
            quit;
          "

      # Alarmkanal ist DISCORD (korrigiert 12.08.2026, vorher Telegram — wird nicht mehr gelesen).
      - name: Discord Alert on Failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "::error::DISCORD_WEBHOOK_URL ist nicht gesetzt — der Alarm konnte NICHT zugestellt werden."
            exit 1
          fi
          jq -nc \
            --arg kopf "🔴 **Deploy fehlgeschlagen** — ristorantestoria.de" \
            --arg zeile "Branch: ${{ github.ref_name }} · Commit: ${{ github.sha }}" \
            --arg link "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{content: ($kopf + "\n" + $zeile + "\n" + $link)}' \
            | curl -sS -f -X POST -H 'Content-Type: application/json' -d @- "$DISCORD_WEBHOOK_URL"
