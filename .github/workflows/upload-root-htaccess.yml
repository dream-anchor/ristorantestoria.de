name: Upload Root .htaccess to IONOS

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    # 10 Minuten (12.08.2026). Der Job laedt EINE Datei per SFTP hoch; er lief im gemessenen
    # Fenster 29.07.–12.08.2026 kein einziges Mal, deshalb gibt es keinen eigenen Messwert.
    # Zum Vergleich: der vollstaendige Deploy inklusive Build und Spiegel braucht ø 93 s.
    # WARUM UEBERHAUPT EIN DECKEL: ohne `timeout-minutes` gilt GitHubs Vorgabe von 360 Minuten —
    # ein haengender SFTP-Aufruf blockiert sonst sechs Stunden lang einen Laeufer.
    # Regel: docs/ci/CI-KOSTEN-STANDARD.md Punkt 2.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload root .htaccess via lftp
        run: |
          sudo apt-get install -y lftp
          lftp -c "
            set ssl:verify-certificate no;
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            open -u ${{ secrets.IONOS_SFTP_USER }},${{ secrets.IONOS_SFTP_PASSWORD }} sftp://${{ secrets.IONOS_SFTP_HOST }};
            put -O / root-htaccess/.htaccess;
            bye;
          "
          echo "Root .htaccess uploaded successfully"
