name: Uptime Monitor (All Sites)

on:
  schedule:
    # Alle 30 Minuten, aber VERSETZT statt zur vollen und halben Stunde (geändert 12.08.2026).
    # Zwei Gründe, beide belegt:
    # 1. GitHub empfiehlt ausdrücklich, Zeitpläne NICHT auf den Stundenanfang zu legen — dort
    #    laufen die meisten Cron-Jobs der Plattform zusammen, und Actions-Zeitpläne sind
    #    „best effort". Gemessen an 100 Läufen (08.–12.08.2026): konfiguriert 30 Minuten,
    #    tatsächlich Median 55, Maximum 137, 39 von 99 Abständen über einer Stunde.
    # 2. Wer die `cron`-Zeile ändert, wird laut GitHub-Doku zum EMPFÄNGER der Benachrichtigung
    #    über fehlgeschlagene geplante Läufe — und die ist seit 12.08.2026 der einzige
    #    Alarmkanal dieses Workflows (siehe Prüfschritt unten). Der erste Commit dieser Datei
    #    trug eine lokale Adresse ohne GitHub-Konto; der Empfänger war damit unbestimmt.
    - cron: '7,37 * * * *'
  workflow_dispatch:

jobs:
  check-sites:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check all sites (1. Durchlauf)
        id: check
        run: |
          # ── Adressliste, korrigiert am 12.08.2026 ────────────────────────────────────────
          # Vorher stand hier "https://www.schrittmacher.ai/". Dieser Host ist NICHT
          # eingerichtet und antwortet dauerhaft mit HTTP 530 (Cloudflare) — der Dienst selbst
          # laeuft: schrittmacher.ai = 200, storia.schrittmacher.ai = 200 (geprueft 12.08.2026).
          # Der Monitor hat damit bei JEDEM Lauf einen Ausfall gemeldet, der keiner war.
          SITES=(
            "https://www.ristorantestoria.de/"
            "https://events-storia.de/"
            "https://www.paterbrown.com/"
            "https://www.franzmeiller.com/"
            "https://www.stefaniesick.com/"
            "https://www.trauworte.com/"
            "https://schrittmacher.ai/"
          )

          FAILED_FIRST=""
          for site in "${SITES[@]}"; do
            # --retry/--max-time seit 12.08.2026 grosszuegiger: www.franzmeiller.com meldete aus
            # den GitHub-Runnern heraus dauerhaft "000" (Verbindung kam nicht zustande),
            # antwortet von aussen aber in 0,15 s mit HTTP 200 (geprueft 12.08.2026). Die
            # Ursache ist NICHT geklaert — es ist ein Runner-seitiges Netzproblem, kein
            # Ausfall der Seite. Ein einzelner Fehlversuch darf deshalb nicht sofort den
            # 3-Minuten-Zweig ausloesen. Endgueltig behoben wird das erst mit dem Umzug zu
            # einem echten Uptime-Dienst, der von mehreren Standorten prueft (docs/ci/CI-KOSTEN-STANDARD.md Punkt 7).
            #
            # `|| echo 000` ist entfallen: curl schreibt bei Verbindungsfehlern bereits "000",
            # der zusaetzliche echo haengte ein zweites an -> die Logs zeigten "HTTP 000000".
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 30 --retry 2 --retry-delay 3 "$site")
            STATUS=${STATUS:-000}
            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
              echo "✅ $site — HTTP $STATUS"
            else
              echo "⚠️ $site — HTTP $STATUS (wird erneut geprüft)"
              FAILED_FIRST="$FAILED_FIRST $site"
            fi
          done

          # Wenn nichts fehlgeschlagen: fertig
          if [ -z "$FAILED_FIRST" ]; then
            echo "Alle Adressen erreichbar."
            exit 0
          fi

          # Warte 3 Minuten, dann erneut prüfen
          echo "⏳ Warte 3 Minuten vor erneuter Prüfung..."
          sleep 180

          FAILED=""
          for site in $FAILED_FIRST; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 30 --retry 2 --retry-delay 3 "$site")
            STATUS=${STATUS:-000}
            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
              echo "✅ $site — nach Retry wieder OK"
            else
              echo "❌ $site — dauerhaft offline (HTTP $STATUS)"
              FAILED="${FAILED}❌ ${site} — HTTP ${STATUS}%0A"
            fi
          done

          # ── Der Befund IST der Alarm (12.08.2026) ────────────────────────────────────────
          # Es gibt bewusst keinen eigenen Alarmschritt mehr: kein Discord, kein Telegram,
          # kein zusaetzliches Secret. Ein Ausfall laesst diesen Job FEHLSCHLAGEN; der Kanal
          # ist GitHubs Standardbenachrichtigung fuer fehlgeschlagene geplante Laeufe.
          #
          # DAMIT DIESER KANAL TRAEGT, MUSS ZWEIERLEI STIMMEN (GitHub-Doku, "Notifications for
          # workflow runs"): "Notifications for scheduled workflows are sent to the user who
          # initially created the workflow" — und wer die `cron`-Zeile aendert, wird zum neuen
          # Empfaenger. Zweitens muessen unter github.com/settings/notifications die
          # Actions-Benachrichtigungen eingeschaltet sein.
          # Deshalb wurde die `cron`-Zeile oben am 12.08.2026 bewusst von info@monot.com
          # angefasst: der erste Commit dieser Datei (09.03.2026) trug die lokale Adresse
          # antoinemonot@Antoines-MacBook-Pro-2.local, die zu keinem GitHub-Konto gehoert —
          # der Empfaenger der Benachrichtigung war damit unbestimmt.
          # WER HIER DEN ZEITPLAN AENDERT, UEBERNIMMT DEN ALARM. Das ist kein Nebeneffekt,
          # sondern der Mechanismus.
          if [ -n "$FAILED" ]; then
            echo "::error::Site(s) dauerhaft offline:"
            printf '%s' "$FAILED" | sed 's/%0A/\n/g'
            exit 1
          fi
          echo "Alle Adressen erreichbar."
