name: Uptime Monitor (All Sites)

on:
  schedule:
    # Alle 30 Minuten prüfen
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  check-sites:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check all sites (1. Durchlauf)
        id: check
        run: |
          # ── Adressliste, korrigiert am 12.08.2026 ────────────────────────────────────────
          # Vorher stand hier "https://www.schrittmacher.ai/". Dieser Host ist NICHT
          # eingerichtet und antwortet dauerhaft mit HTTP 530 (Cloudflare) — der Dienst selbst
          # laeuft: schrittmacher.ai = 200, storia.schrittmacher.ai = 200 (geprueft 12.08.2026).
          # Der Monitor hat damit bei JEDEM Lauf einen Ausfall gemeldet, der keiner war.
          SITES=(
            "https://www.ristorantestoria.de/"
            "https://events-storia.de/"
            "https://www.paterbrown.com/"
            "https://www.franzmeiller.com/"
            "https://www.stefaniesick.com/"
            "https://www.trauworte.com/"
            "https://schrittmacher.ai/"
          )

          FAILED_FIRST=""
          for site in "${SITES[@]}"; do
            # --retry/--max-time seit 12.08.2026 grosszuegiger: www.franzmeiller.com meldete aus
            # den GitHub-Runnern heraus dauerhaft "000" (Verbindung kam nicht zustande),
            # antwortet von aussen aber in 0,15 s mit HTTP 200 (geprueft 12.08.2026). Die
            # Ursache ist NICHT geklaert — es ist ein Runner-seitiges Netzproblem, kein
            # Ausfall der Seite. Ein einzelner Fehlversuch darf deshalb nicht sofort den
            # 3-Minuten-Zweig ausloesen. Endgueltig behoben wird das erst mit dem Umzug zu
            # einem echten Uptime-Dienst, der von mehreren Standorten prueft (docs/ci/CI-KOSTEN-STANDARD.md Punkt 7).
            #
            # `|| echo 000` ist entfallen: curl schreibt bei Verbindungsfehlern bereits "000",
            # der zusaetzliche echo haengte ein zweites an -> die Logs zeigten "HTTP 000000".
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 30 --retry 2 --retry-delay 3 "$site")
            STATUS=${STATUS:-000}
            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
              echo "✅ $site — HTTP $STATUS"
            else
              echo "⚠️ $site — HTTP $STATUS (wird erneut geprüft)"
              FAILED_FIRST="$FAILED_FIRST $site"
            fi
          done

          # Wenn nichts fehlgeschlagen: fertig
          if [ -z "$FAILED_FIRST" ]; then
            echo "failed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Warte 3 Minuten, dann erneut prüfen
          echo "⏳ Warte 3 Minuten vor erneuter Prüfung..."
          sleep 180

          FAILED=""
          for site in $FAILED_FIRST; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 30 --retry 2 --retry-delay 3 "$site")
            STATUS=${STATUS:-000}
            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
              echo "✅ $site — nach Retry wieder OK"
            else
              echo "❌ $site — dauerhaft offline (HTTP $STATUS)"
              FAILED="${FAILED}❌ ${site} — HTTP ${STATUS}%0A"
            fi
          done

          if [ -n "$FAILED" ]; then
            echo "failed=true" >> $GITHUB_OUTPUT
            echo "details=$FAILED" >> $GITHUB_OUTPUT
          else
            echo "failed=false" >> $GITHUB_OUTPUT
          fi

      # Alarmkanal ist DISCORD (korrigiert 12.08.2026). Vorher ging der Alarm nach Telegram —
      # dieser Kanal wird nicht mehr gelesen, der Melder haette also ins Leere gemeldet.
      - name: Discord Alert on Downtime
        if: steps.check.outputs.failed == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          # Fehlt das Secret, wird der Schritt LAUT rot statt still nichts zu tun. Ein Melder,
          # der im Ernstfall schweigt, ist schlimmer als gar keiner.
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "::error::DISCORD_WEBHOOK_URL ist nicht gesetzt — der Ausfall-Alarm konnte NICHT zugestellt werden. Secret anlegen: gh secret set DISCORD_WEBHOOK_URL"
            exit 1
          fi
          # Die Ausgabe des Pruefschritts benutzt %0A als Zeilentrenner (Erbe des
          # Telegram-Formats). Fuer Discord wird daraus ein echter Zeilenumbruch.
          details=$(printf '%s' "${{ steps.check.outputs.details }}" | sed 's/%0A/\n/g')
          jq -nc \
            --arg kopf "🔴 **Site(s) dauerhaft offline!**" \
            --arg details "$details" \
            --arg link "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{content: ($kopf + "\n" + $details + "\n" + $link)}' \
            | curl -sS -f -X POST -H 'Content-Type: application/json' -d @- "$DISCORD_WEBHOOK_URL"
