name: Update WM Fixtures (Daily)

# Trägt feststehende WM-2026-K.o.-Paarungen automatisch nach (football-data.org).
# Schreibt nur src/pages/seo/wmTeams.json. Push auf main triggert KEINEN Deploy direkt
# (GITHUB_TOKEN-Pushes lösen keine Workflows aus) – der Deploy hängt per `workflow_run`
# am Abschluss dieses Workflows (siehe deploy-ionos.yml).
#
# Das Script ist außerhalb des Turnierfensters (30.06.–19.07.2026) ein No-Op.
# NACH DEM TURNIER kann dieser Workflow gelöscht werden.

on:
  schedule:
    # EINMAL täglich, 07:00 UTC (Stand 12.08.2026). Gemessen wurden vorher 29 Läufe in 14 Tagen
    # bei zweimal täglich (07:00 + 15:00) – jeder Lauf, der etwas ändert, zieht über
    # `workflow_run` einen vollen Build + SFTP-Spiegel nach sich.
    #
    # WARUM EINMAL REICHT: es läuft gerade kein Turnier. Die WM endete am 19.07.2026, die
    # 2. Bundesliga startete am 07.08., die Bundesliga folgt am 28.08., der DFB-Pokal vom
    # 21.–24.08. Ausserhalb eines Turnierfensters ist das Script ohnehin ein No-Op (siehe oben).
    #
    # WIEDER HOCHDREHEN (eine Zeile): ab dem 20.08.2026 sind zwei Läufe wieder sinnvoll –
    # dann die Zeile unten durch  - cron: '0 7,15 * * *'  ersetzen. Mehr ist nicht nötig.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Turnierfenster ignorieren (--force)'
        type: boolean
        default: false

jobs:
  update-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Update WM fixtures
        id: update
        run: npm run update-wm ${{ inputs.force && '-- --force' || '' }}
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet src/pages/seo/wmTeams.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Keine neuen Paarungen."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "wmTeams.json geändert — wird committet."
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/pages/seo/wmTeams.json
          git commit -m "data: WM-2026-Paarungen automatisch nachgetragen ($(date +%Y-%m-%d))"
          git push

      # ── Kein eigener Alarmschritt mehr (12.08.2026) ────────────────────────────────────
      # Beide Telegram-Schritte sind entfallen — der Kanal wird nicht mehr gelesen, und die
      # Secrets werden geloescht. Ein `curl` gegen eine tote Bot-Adresse haette hier
      # STILLSCHWEIGEND nichts getan (`curl -s` ohne `-f` endet mit 0), der Schritt waere gruen
      # geblieben. Genau diese Sorte Melder ist schlimmer als keiner.
      #
      # Der "manuelle Aktion noetig"-Fall meldet sich jetzt, indem der Job FEHLSCHLAEGT: nur so
      # entsteht ueberhaupt eine Benachrichtigung. Die Liste steht in der Fehlermeldung.
      - name: Manuelle Aktion noetig? Dann laut scheitern.
        if: steps.update.outputs.manual != ''
        run: |
          echo "::error::WM-Paarung manuell nachtragen — diese Teams stehen fest, konnten aber nicht automatisch zugeordnet werden (Nation fehlt in der Tabelle):"
          printf '%s' "${{ steps.update.outputs.manual }}" | sed 's/%0A/\n/g'
          echo "Bitte in src/pages/seo/wmTeams.json ergaenzen (Nation in scripts/wm-nations.mjs aufnehmen)."
          exit 1
