name: Update WM Fixtures (Daily)

# Trägt feststehende WM-2026-K.o.-Paarungen automatisch nach (football-data.org).
# Schreibt nur src/pages/seo/wmTeams.json. Push auf main triggert KEINEN Deploy direkt
# (GITHUB_TOKEN-Pushes lösen keine Workflows aus) – der Deploy hängt per `workflow_run`
# am Abschluss dieses Workflows (siehe deploy-ionos.yml).
#
# Das Script ist außerhalb des Turnierfensters (30.06.–19.07.2026) ein No-Op.
# NACH DEM TURNIER kann dieser Workflow gelöscht werden.

on:
  schedule:
    # 07:00 & 15:00 UTC – nach den nächtlichen K.o.-Spielen (Anstoß bis ~01:30 MESZ).
    - cron: '0 7,15 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Turnierfenster ignorieren (--force)'
        type: boolean
        default: false

jobs:
  update-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Update WM fixtures
        id: update
        run: npm run update-wm ${{ inputs.force && '-- --force' || '' }}
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet src/pages/seo/wmTeams.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Keine neuen Paarungen."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "wmTeams.json geändert — wird committet."
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/pages/seo/wmTeams.json
          git commit -m "data: WM-2026-Paarungen automatisch nachgetragen ($(date +%Y-%m-%d))"
          git push

      - name: Telegram – manuelle Aktion nötig
        if: steps.update.outputs.manual != ''
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            --data-urlencode "text=🟡 <b>WM-Paarung manuell nachtragen</b>%0A%0AFolgende Teams stehen fest, konnten aber nicht automatisch zugeordnet werden (Nation fehlt in der Tabelle):%0A%0A${{ steps.update.outputs.manual }}%0A%0ABitte in <code>src/pages/seo/wmTeams.json</code> ergänzen (Nation in scripts/wm-nations.mjs aufnehmen)."

      - name: Telegram Alert on Failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d text="🔴 <b>WM-Fixtures-Update fehlgeschlagen</b>%0A%0ARepo: ristorantestoria.de%0ATrigger: ${{ github.event_name }}%0A%0A<a href=\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\">→ Logs ansehen</a>"
